name: Build Image (Kaniko) anjayyyyyy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Auth
        run: |
          mkdir -p $GITHUB_WORKSPACE/.kaniko/.docker
          cat <<EOF > $GITHUB_WORKSPACE/.kaniko/.docker/config.json
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "username": "${{ secrets.DOCKER_USERNAME }}",
                "password": "${{ secrets.DOCKER_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Build & Push Image
        run: |
          kaniko-executor \
            --dockerfile=$GITHUB_WORKSPACE/Dockerfile \
            --context=$GITHUB_WORKSPACE \
            --destination=dans9881/flask-ml-app:latest \
            --destination=dans9881/flask-ml-app:${{ github.sha }} \
            --docker-config=$GITHUB_WORKSPACE/.kaniko/.docker \
            --verbosity=info