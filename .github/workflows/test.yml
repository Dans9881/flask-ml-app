name: Build & Push Image (Kaniko)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create / Update Docker Registry Secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-username=${{ secrets.DOCKER_USERNAME }} \
            --docker-password=${{ secrets.DOCKER_PASSWORD }} \
            --docker-server=index.docker.io \
            -n actions-runner \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kaniko Job
        run: |
          export IMAGE_TAG=${{ github.sha }}
          export JOB_NAME=kaniko-build-${{ github.run_id }}

          envsubst < k8s/infra/ci-runner/base/kaniko-job.yaml \
          | sed "s/name: kaniko-build/name: $JOB_NAME/g" \
          | kubectl apply -f -

      - name: Copy source to Kaniko pod
        run: |
          sleep 5
          POD=$(kubectl get pods -n actions-runner -l job-name=kaniko-build-${{ github.run_id }} -o jsonpath="{.items[0].metadata.name}")
          kubectl cp . actions-runner/$POD:/workspace

      - name: Wait for Job Completion
        run: |
          kubectl wait --for=condition=complete job/kaniko-build-${{ github.run_id }} \
            -n actions-runner --timeout=300s

      - name: Show Kaniko Logs
        run: |
          kubectl logs job/kaniko-build-${{ github.run_id }} -n actions-runner

      - name: Cleanup Job
        if: always()
        run: |
          kubectl delete job kaniko-build-${{ github.run_id }} -n actions-runner