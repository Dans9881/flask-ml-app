name: Build Image (Kaniko)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Auth
        run: |
          mkdir -p $GITHUB_WORKSPACE/.docker

          AUTH=$(echo -n "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" | base64)

          cat <<EOF > $GITHUB_WORKSPACE/.docker/config.json
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "auth": "$AUTH"
              }
            }
          }
          EOF

      - name: Inject Auth to Kaniko
        run: |
          mkdir -p /kaniko/.docker
          cp $GITHUB_WORKSPACE/.docker/config.json /kaniko/.docker/config.json

      - name: Debug (optional)
        run: |
          ls -lah /kaniko/.docker
          cat /kaniko/.docker/config.json
      
      - name: DEBUG KANIKO FS
        run: |
          echo "== WHOAMI =="
          whoami

          echo "== ROOT FS =="
          ls -lah /

          echo "== /kaniko =="
          ls -lah /kaniko || true

          echo "== CREATE TEST FILE =="
          mkdir -p /kaniko/.docker
          echo "test" > /kaniko/.docker/test.txt

          echo "== VERIFY =="
          ls -lah /kaniko/.docker
          cat /kaniko/.docker/test.txt

      - name: Build & Push Image
        run: |
          /usr/local/bin/kaniko-executor \
            --dockerfile=$GITHUB_WORKSPACE/Dockerfile \
            --context=$GITHUB_WORKSPACE \
            --destination=dans9881/flask-ml-app:latest \
            --destination=dans9881/flask-ml-app:${{ github.sha }} \
            --verbosity=info