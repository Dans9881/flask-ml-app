name: Build Image testing kaniko

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Auth
        run: |
          mkdir -p /kaniko/.docker

          cat <<EOF > /kaniko/.docker/config.json
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "username": "${{ secrets.DOCKER_USERNAME }}",
                "password": "${{ secrets.DOCKER_PASSWORD }}"
              }
            }
          }
          EOF

          echo "=== CHECK CONFIG ==="
          cat /kaniko/.docker/config.json

      - name: Debug Secrets
        run: |
          echo "USERNAME: ${{ secrets.DOCKER_USERNAME }}"
          echo "PASS LENGTH: $(echo -n "${{ secrets.DOCKER_PASSWORD }}" | wc -c)"

      - name: Build & Push Image
        run: |
          /usr/local/bin/kaniko-executor \
            --dockerfile=$GITHUB_WORKSPACE/Dockerfile \
            --context=$GITHUB_WORKSPACE \
            --destination=dans9881/flask-ml-app:latest \
            --destination=dans9881/flask-ml-app:${{ github.sha }} \
            --verbosity=info