name: Build Image (Kaniko)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Auth
        run: |
          mkdir -p $GITHUB_WORKSPACE/.kaniko/.docker
          cat <<EOF > $GITHUB_WORKSPACE/.kaniko/.docker/config.json
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "username": "${{ secrets.DOCKER_USERNAME }}",
                "password": "${{ secrets.DOCKER_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Check Python
        run: |
          python3 --version

      - name: Download Kaniko Executor
        run: |
          echo "import urllib.request
          url = 'https://github.com/GoogleContainerTools/kaniko/releases/latest/download/executor-linux-amd64'
          output = '${GITHUB_WORKSPACE}/kaniko-executor'
          urllib.request.urlretrieve(url, output)" > download.py

          python3 download.py
          chmod +x $GITHUB_WORKSPACE/kaniko-executor

      - name: Build & Push Image
        run: |
          $GITHUB_WORKSPACE/kaniko-executor \
            --dockerfile=Dockerfile \
            --context=$GITHUB_WORKSPACE \
            --destination=dans9881/flask-ml-app:latest \
            --docker-config=$GITHUB_WORKSPACE/.kaniko/.docker \
            --verbosity=info