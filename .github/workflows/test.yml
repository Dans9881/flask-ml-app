name: Build Image kaniko

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker auth
        run: |
          mkdir -p /tmp/.docker
          cat > /tmp/.docker/config.json <<EOF
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "username": "${{ secrets.DOCKER_USERNAME }}",
                "password": "${{ secrets.DOCKER_PASSWORD }}"
              }
            }
          }
          EOF
          export DOCKER_CONFIG=/tmp/.docker

      - name: Build & Push with Kaniko
        run: |
          export DOCKER_CONFIG=/tmp/.docker

          echo "Workspace: $GITHUB_WORKSPACE"
          ls -lah $GITHUB_WORKSPACE

          /usr/local/bin/kaniko-executor \
            --context=dir://$GITHUB_WORKSPACE \
            --dockerfile=$GITHUB_WORKSPACE/Dockerfile \
            --destination=dans9881/flask-ml-app:latest \
            --destination=dans9881/flask-ml-app:${{ github.sha }} \
            --verbosity=debug