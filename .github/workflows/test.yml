name: Build Image (Kaniko)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔥 Setup Docker Auth (BASE64 FIX)
      - name: Setup Docker Auth
        run: |
          mkdir -p /kaniko/.docker

          AUTH=$(echo -n "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" | base64 | tr -d '\n')

          cat <<EOF > /kaniko/.docker/config.json
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "auth": "$AUTH"
              }
            }
          }
          EOF

      # 🔍 DEBUG: cek config kebaca
      - name: Debug Config
        run: |
          echo "=== CONFIG ==="
          cat /kaniko/.docker/config.json

      # 🔍 DEBUG: test login manual ke Docker Hub
      - name: Debug Docker Auth
        run: |
          echo "=== TEST AUTH ==="
          curl -s -o /dev/null -w "%{http_code}\n" https://index.docker.io/v1/

      # 🔥 BUILD + PUSH
      - name: Build & Push Image
        run: |
          /usr/local/bin/kaniko-executor \
            --dockerfile=$GITHUB_WORKSPACE/Dockerfile \
            --context=$GITHUB_WORKSPACE \
            --destination=dans9881/flask-ml-app:latest \
            --destination=dans9881/flask-ml-app:${{ github.sha }} \
            --verbosity=debug