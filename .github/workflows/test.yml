name: Build Image (Kaniko)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Auth
        run: |
          mkdir -p /kaniko/.docker
          cat <<EOF > /kaniko/.docker/config.json
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "username": "${{ secrets.DOCKER_USERNAME }}",
                "password": "${{ secrets.DOCKER_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Download Kaniko
        run: |
          wget -q -O /kaniko-executor https://github.com/GoogleContainerTools/kaniko/releases/latest/download/executor-linux-amd64
          chmod +x /kaniko-executor

      - name: Build & Push
        run: |
          /kaniko-executor \
            --dockerfile=Dockerfile \
            --context=. \
            --destination=dans9881/flask-ml-app:latest