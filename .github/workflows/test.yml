name: Build & Push Image (Kaniko K8s)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create / Update Docker Registry Secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-username=${{ secrets.DOCKER_USERNAME }} \
            --docker-password=${{ secrets.DOCKER_PASSWORD }} \
            --docker-server=index.docker.io \
            --dry-run=client -o yaml | kubectl apply -n actions-runner -f -

      - name: Run Kaniko Build Job
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: kaniko-build-${{ github.run_id }}
            namespace: actions-runner
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:latest
                    args:
                      - "--dockerfile=/workspace/Dockerfile"
                      - "--context=git://github.com/${{ github.repository }}#${{ github.sha }}"
                      - "--destination=dans9881/flask-ml-app:latest"
                      - "--destination=dans9881/flask-ml-app:${{ github.sha }}"
                      - "--verbosity=info"
                    volumeMounts:
                      - name: docker-config
                        mountPath: /kaniko/.docker
                volumes:
                  - name: docker-config
                    secret:
                      secretName: dockerhub-secret
          EOF

      - name: Wait for Job Completion
        run: |
          kubectl wait --for=condition=complete job/kaniko-build-${{ github.run_id }} \
            -n actions-runner --timeout=300s

      - name: Show Kaniko Logs
        run: |
          kubectl logs job/kaniko-build-${{ github.run_id }} -n actions-runner

      - name: Cleanup Job
        if: always()
        run: |
          kubectl delete job kaniko-build-${{ github.run_id }} -n actions-runner