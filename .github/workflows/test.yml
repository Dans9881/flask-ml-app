name: Build Image (Kaniko)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Auth
        run: |
          mkdir -p $GITHUB_WORKSPACE/.kaniko/.docker
          AUTH=$(echo -n "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" | base64 | tr -d '\n')

          cat <<EOF > $GITHUB_WORKSPACE/.kaniko/.docker/config.json
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "auth": "$AUTH"
              }
            }
          }
          EOF

      - name: Build & Push Image (Kaniko)
        run: |
          /kaniko/executor \
            --dockerfile=$GITHUB_WORKSPACE/Dockerfile \
            --context=$GITHUB_WORKSPACE \
            --destination=dans9881/flask-ml-app:latest \
            --destination=dans9881/flask-ml-app:${{ github.sha }} \
            --docker-config=$GITHUB_WORKSPACE/.kaniko/.docker \
            --cache=true \
            --cache-repo=dans9881/flask-ml-app \
            --snapshot-mode=redo \
            --verbosity=info