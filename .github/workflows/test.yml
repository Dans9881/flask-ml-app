name: build-and-push-yesting

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker auth
        run: |
          mkdir -p $HOME/.docker
          echo '${{ secrets.DOCKER_CONFIG_JSON }}' > $HOME/.docker/config.json

      - name: Build & Push image with Kaniko
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v $HOME/.docker:/kaniko/.docker \
            gcr.io/kaniko-project/executor:latest \
            --dockerfile=Dockerfile \
            --context=dir:///workspace \
            --destination=docker.io/dans9881/flask-ml:${{ github.sha }} \
            --cache=true \
            --cache-repo=docker.io/dans9881/cache